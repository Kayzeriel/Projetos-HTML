<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cartão de Visita — Elissandro Romão</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">

<style>
:root {
  --verde-escuro: #17382a;
  --verde: #3f7139;
  --verde-claro: #e9f0e7;
  --laranja: #e4672a;
  --creme: #f8f5ec;
  --branco: #ffffff;
  --texto: #25251f;
  --texto-suave: #77776f;
  --borda: #e6e3da;
  --sombra: 0 24px 60px rgba(23, 56, 42, .18);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 32px 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(circle at top left, #f4f1e7 0, transparent 35%),
    #e4e0d5;
  font-family: "DM Sans", sans-serif;
  color: var(--texto);
}

/* =========================
   CARTÃO
========================= */

.cartao {
  width: min(100%, 760px);
  min-height: 430px;
  display: grid;
  grid-template-columns: 38% 62%;
  overflow: hidden;
  border-radius: 24px;
  background: var(--creme);
  box-shadow: var(--sombra);
}

/* =========================
   LADO ESQUERDO
========================= */

.identidade {
  position: relative;
  overflow: hidden;
  padding: 38px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  color: var(--creme);
  background:
    linear-gradient(145deg, rgba(255,255,255,.04), transparent 55%),
    var(--verde-escuro);
}

.identidade::before {
  content: "";
  position: absolute;
  width: 240px;
  height: 240px;
  right: -110px;
  bottom: -100px;
  border-radius: 50%;
  background: var(--laranja);
  opacity: .15;
}

.identidade::after {
  content: "";
  position: absolute;
  width: 150px;
  height: 150px;
  left: -95px;
  top: 40%;
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 50%;
}

/* Logo */

.logo {
  position: relative;
  z-index: 2;
  width: 64px;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 18px;
  background: var(--laranja);
  color: var(--verde-escuro);
  font-family: "Fraunces", serif;
  font-size: 23px;
  font-weight: 700;
  box-shadow: 0 12px 25px rgba(0,0,0,.15);
}

.marca {
  position: relative;
  z-index: 2;
}

.nome-banca {
  margin: 0 0 8px;
  font-family: "Fraunces", serif;
  font-size: clamp(25px, 3vw, 36px);
  line-height: 1.02;
  letter-spacing: -.04em;
}

.segmento {
  margin: 0;
  max-width: 180px;
  color: rgba(248,245,236,.72);
  font-size: 13px;
  line-height: 1.5;
}

/* =========================
   LADO DIREITO
========================= */

.contato {
  padding: 42px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  background: var(--creme);
}

.contato-topo {
  display: flex;
  flex-direction: column;
}

.tag {
  width: fit-content;
  margin-bottom: 14px;
  padding: 6px 10px;
  border-radius: 999px;
  background: var(--verde-claro);
  color: var(--verde);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .05em;
  text-transform: uppercase;
}

.titular {
  margin: 0;
  font-family: "Fraunces", serif;
  font-size: clamp(26px, 3vw, 34px);
  line-height: 1.05;
  letter-spacing: -.035em;
  color: var(--texto);
}

.cargo {
  margin: 8px 0 30px;
  color: var(--texto-suave);
  font-size: 13px;
}

/* =========================
   INFORMAÇÕES
========================= */

.lista-info {
  display: flex;
  flex-direction: column;
  gap: 13px;
}

.linha-info {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
  font-size: 13px;
  color: var(--texto);
}

.icone {
  width: 38px;
  height: 38px;
  flex: 0 0 38px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 11px;
  background: #f0ece2;
  color: var(--laranja);
}

.icone svg {
  width: 17px;
  height: 17px;
}

.linha-info span:last-child {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* =========================
   RODAPÉ
========================= */

.rodape {
  margin-top: 35px;
  padding-top: 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  border-top: 1px solid var(--borda);
}

.rede-link {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  color: var(--texto);
  text-decoration: none;
  font-size: 12px;
  font-weight: 600;
  transition: .2s ease;
}

.rede-link:hover {
  color: var(--laranja);
}

.icone-rede {
  width: 30px;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 9px;
  background: var(--verde-escuro);
  color: var(--creme);
}

.icone-rede svg {
  width: 15px;
  height: 15px;
}

.cidade {
  color: var(--verde);
  font-size: 11px;
  font-weight: 700;
  white-space: nowrap;
}

/* =========================
   RESPONSIVIDADE
========================= */

@media (max-width: 650px) {

  body {
    padding: 20px 14px;
  }

  .cartao {
    width: 100%;
    min-height: auto;
    grid-template-columns: 1fr;
    border-radius: 20px;
  }

  .identidade {
    min-height: 230px;
    padding: 28px;
  }

  .logo {
    width: 56px;
    height: 56px;
    border-radius: 15px;
    font-size: 20px;
  }

  .nome-banca {
    font-size: 28px;
  }

  .segmento {
    font-size: 12px;
  }

  .contato {
    padding: 30px 28px;
  }

  .titular {
    font-size: 28px;
  }

  .cargo {
    margin-bottom: 24px;
  }

  .rodape {
    margin-top: 30px;
  }
}

/* =========================
   CELULARES PEQUENOS
========================= */

@media (max-width: 390px) {

  body {
    padding: 12px;
  }

  .identidade {
    min-height: 205px;
    padding: 24px;
  }

  .contato {
    padding: 25px 22px;
  }

  .titular {
    font-size: 25px;
  }

  .linha-info {
    font-size: 12px;
  }

  .icone {
    width: 34px;
    height: 34px;
    flex-basis: 34px;
  }

  .cidade {
    display: none;
  }
}

/* =========================
   IMPRESSÃO
========================= */

@media print {

  body {
    padding: 0;
    background: white;
  }

  .cartao {
    box-shadow: none;
  }
}
</style>
</head>
