<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Cartão de Visita — Comerciante Ceasa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --verde-mata:  #1F3B2C;
    --verde-folha: #4B7A3E;
    --laranja:     #E2672A;
    --creme:       #F6F1E4;
    --grafite:     #241F18;
    --linha:       rgba(246,241,228,0.22);
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background: #E7E2D3;
    font-family:'Work Sans', sans-serif;
    padding:40px 20px;
  }

  /* ===== Cartão — proporção padrão 3.5 x 2 pol ===== */
  .cartao{
    width: 350px;
    height: 200px;
    display:flex;
    border-radius: 14px;
    overflow:hidden;
    box-shadow: 0 18px 40px rgba(31,59,44,0.25);
    background: var(--creme);
  }

  /* ----- Coluna esquerda: identidade ----- */
  .identidade{
    flex: 0 0 38%;
    background: var(--verde-mata);
    color: var(--creme);
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:18px 16px;
    position:relative;
    overflow:hidden;
  }

  .identidade::after{
    content:"";
    position:absolute;
    right:-30px;
    bottom:-30px;
    width:110px;
    height:110px;
    border-radius:50%;
    background: var(--laranja);
    opacity:0.16;
  }

  .selo{
    width:40px;
    height:40px;
    border-radius:50%;
    background: var(--laranja);
    color: var(--verde-mata);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:16px;
    z-index:1;
  }

  .marca{
    z-index:1;
  }

  .marca .nome-banca{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:17px;
    line-height:1.15;
    margin:0 0 4px 0;
  }

  .marca .segmento{
    font-size:10.5px;
    letter-spacing:0.02em;
    color: var(--creme);
    opacity:0.75;
    margin:0;
  }

  /* ----- Coluna direita: contato ----- */
  .contato{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:16px 18px;
  }

  .contato-topo{
    display:flex;
    flex-direction:column;
  }

  .titular{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:15px;
    color: var(--grafite);
    margin:0 0 1px 0;
  }

  .cargo{
    font-size:10.5px;
    color: var(--verde-folha);
    margin:0 0 10px 0;
    font-weight:500;
  }

  .lista-info{
    display:flex;
    flex-direction:column;
    gap:6px;
  }

  .linha-info{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:10.5px;
    color: var(--grafite);
  }

  .linha-info .icone{
    flex:0 0 14px;
    width:14px;
    height:14px;
    color: var(--laranja);
  }

  .linha-info .icone svg{
    width:100%;
    height:100%;
    display:block;
  }

  .linha-info span{
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  /* ----- Rodapé: rede social ----- */
  .rodape{
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-top:1px solid rgba(36,31,24,0.1);
    padding-top:9px;
    margin-top:6px;
  }

  .rede-link{
    display:flex;
    align-items:center;
    gap:6px;
    text-decoration:none;
    color: var(--grafite);
    font-size:10px;
    font-weight:500;
  }

  .rede-link .icone-rede{
    width:18px;
    height:18px;
    border-radius:50%;
    background: var(--verde-mata);
    display:flex;
    align-items:center;
    justify-content:center;
    color: var(--creme);
    flex:0 0 18px;
  }

  .rede-link .icone-rede svg{
    width:10px;
    height:10px;
  }

  .cidade{
    font-size:9.5px;
    color: var(--verde-folha);
    font-weight:500;
  }

</style>
</head>
<body>

  <div class="cartao">

    <!-- Coluna esquerda: identidade visual / logotipo -->
    <div class="identidade">
      <div class="selo">CZ</div>
      <div class="marca">
        <p class="nome-banca">[Nome da Banca / Loja]</p>
        <p class="segmento">[Hortifruti · Ceasa]</p>
      </div>
    </div>

    <!-- Coluna direita: dados de contato -->
    <div class="contato">
      <div class="contato-topo">
        <p class="titular">[Nome do Comerciante]</p>
        <p class="cargo">[Box/Pavilhão Nº ___]</p>

        <div class="lista-info">
          <div class="linha-info">
            <span class="icone">
              <!-- telefone -->
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            </span>
            <span>[(00) 00000-0000]</span>
          </div>

          <div class="linha-info">
            <span class="icone">
              <!-- e-mail -->
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z" opacity="0"/><path d="M22 6l-10 7L2 6"/><rect x="2" y="4" width="20" height="16" rx="2"/></svg>
            </span>
            <span>[email@exemplo.com]</span>
          </div>

          <div class="linha-info">
            <span class="icone">
              <!-- localização -->
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            </span>
            <span>[Pavilhão ___ · Ceasa ___]</span>
          </div>
        </div>
      </div>

      <!-- Rodapé com link para rede social -->
      <div class="rodape">
        <a class="rede-link" href="[URL_DA_REDE_SOCIAL]" target="_blank" rel="noopener">
          <span class="icone-rede">
            <!-- ícone genérico de rede social — trocar pelo logotipo desejado (Instagram/WhatsApp/Facebook) -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
          </span>
          <span>[@usuario]</span>
        </a>
        <span class="cidade">[Cidade/UF]</span>
      </div>
    </div>

  </div>

</body>
</html>
